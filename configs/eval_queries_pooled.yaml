# Pooled relevance labels (fairer than eval_queries.yaml).
# eval_queries.yaml was labelled from model_v1's own top-10, so v1 gets 100% recall on it
# by construction and every other method looks worse. Here, the top-10 of SEVERAL methods
# (v1, chunk scoring, title scoring, query expansion) were pooled per query and each song
# was judged relevant / not relevant without knowing which method found it.
# Songs never judged count as not relevant (standard pooling assumption).
# Use: python scripts/evaluate_search.py --compare --eval-file configs/eval_queries_pooled.yaml
